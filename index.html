<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>CK Login — Animated</title>
<style>
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai','Calibri',Arial,sans-serif;min-height:100vh;color:#0f172a;
background:linear-gradient(180deg,#f6f8ff 0%,#eef2ff 50%,#f3e8ff 100%) fixed;overflow:hidden}
/* ambient background gears */
.amb{position:fixed;fill:#5856D6;opacity:.05;z-index:0}
.amb.a{top:-60px;left:-70px;width:300px;animation:spincw 60s linear infinite}
.amb.b{bottom:-80px;right:-90px;width:380px;animation:spinccw 80s linear infinite}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px}
.login-logo{text-align:center;margin-bottom:26px;animation:fadeUp .55s var(--spring) both}
.login-logo-icon{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#007AFF 0%,#5856D6 100%);
box-shadow:0 14px 30px -8px rgba(0,122,255,.5);margin:0 auto 14px;overflow:hidden;animation:floaty 5s ease-in-out infinite}
.login-logo h1{font-size:21px;font-weight:800}
.login-logo p{font-size:13px;color:#475569;margin-top:4px}
.login-card{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:28px 24px;
width:100%;max-width:340px;text-align:center;backdrop-filter:blur(20px) saturate(160%);
box-shadow:0 10px 40px -10px rgba(15,23,42,.15),0 1px 0 0 rgba(255,255,255,.5) inset;animation:fadeUp .55s .08s var(--spring) both}
.lc-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.7);margin:0 auto 16px;display:flex;
align-items:center;justify-content:center;font-size:24px;animation:fadeUp .5s .16s var(--spring) both}
.login-card h2{font-size:16px;font-weight:700;animation:fadeUp .5s .22s var(--spring) both}
.lc-sub{font-size:12px;color:#64748b;margin-bottom:20px;animation:fadeUp .5s .27s var(--spring) both}
.login-boxes{display:flex;justify-content:center;gap:6px;margin-bottom:16px;animation:fadeUp .5s .33s var(--spring) both}
.login-box{width:36px;height:44px;border-radius:8px;border:2px solid #d1d5db;background:rgba(255,255,255,.7);display:flex;
align-items:center;justify-content:center;font-size:20px;font-weight:700;transition:.15s}
.login-box.filled{border-color:#007AFF;background:rgba(0,122,255,.1);animation:pop .28s var(--spring)}
.login-numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto;animation:fadeUp .5s .39s var(--spring) both}
.login-numpad button{padding:14px;font-size:20px;font-weight:600;border-radius:12px;border:1px solid rgba(255,255,255,.6);
background:rgba(255,255,255,.55);cursor:pointer;transition:transform .12s,background .15s;backdrop-filter:blur(8px)}
.login-numpad button:active{background:rgba(255,255,255,.9);transform:scale(.92)}
.login-footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:20px;animation:fadeUp .5s .45s var(--spring) both}
.gear{transform-box:fill-box;transform-origin:center}
.cw{animation:spincw 9s linear infinite} .ccw{animation:spincw 6s linear infinite reverse}
@keyframes spincw{to{transform:rotate(360deg)}} @keyframes spinccw{to{transform:rotate(-360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

<g transform="translate(55,26) scale(.6)"><g class="gear ccw"><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(0.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(45.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(90.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(135.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(180.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(225.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(270.0)"/><rect x="-2.40" y="-16.50" width="4.80" height="6.00" rx="1.5" transform="rotate(315.0)"/><path fill-rule="evenodd" d="M -11.5,0 a 11.5,11.5 0 1,0 23.0,0 a 11.5,11.5 0 1,0 -23.0,0 Z M -5.0,0 a 5.0,5.0 0 1,1 10.0,0 a 5.0,5.0 0 1,1 -10.0,0 Z"/></g></g></svg></div>
